services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: deepknow-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: deepknow-ui

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      - API_URL=http://api:8000/ask

    depends_on:
      - api

    restart: unless-stopped